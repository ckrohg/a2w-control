# @purpose CI gate for the auto-deploying services: bridge control-path tests (pytest) +
# build/typecheck for hub, planner, and mirror. Runs on pushes/PRs that touch code
# (knowledge/docs commits are ignored) and on release-* tags (the Pi deploy gate).
# Public repo → free standard runners; swap runs-on for Blacksmith later if CI ever grows.
name: CI

on:
  push:
    branches: [main]
    tags: ["release-*"]
    paths-ignore: ["knowledge/**", ".tenet/**", "**.md"]
  pull_request:
    paths-ignore: ["knowledge/**", ".tenet/**", "**.md"]

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: heatpump-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q

  # The planner's assertions are plain node:assert scripts run under tsx, not a vitest suite --
  # so `npm run build` (the node-builds job) never executed them and they gated nothing. They
  # cover the demand floor, the winter DP, hygiene, realized savings and the forecast path:
  # the logic that decides what water temperature this house runs at. Verified all 7 green
  # before wiring them in, so a red here is a real regression, not a pre-existing failure.
  # Runs via `npm test` (same shape as hub-tests and mirror-tests). tsx is NOT a planner
  # devDependency -- npx resolves it on the runner, as this job always has.
  planner-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # setup-node resolves this from the REPO ROOT, not working-directory -- without it
          # the cache step fails with "Dependencies lock file is not found". node-builds
          # already does this via the matrix dir; this job needs its own.
          cache-dependency-path: planner/package-lock.json
      - run: npm ci
      - name: Run planner assertion suites
        run: npm test

  # #166: the hub's Pi-dropout tracker (hub/src/dropouts.ts) is a node:assert script under
  # tsx, the same shape as the planner suites, so `npm run build` would never execute it.
  # Runs via `npm test` (tsx is a hub devDependency, so npm ci is enough — no network fetch).
  hub-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - name: Run hub assertion suites
        run: npm test

  # The mirror's pure state mappings (boost read-back #186, backup card #184, storm banner #183,
  # SPAN breaker control #195, Pi tile #165) have node:assert suites under analytics-mirror/tests/
  # and lib/*.test.ts, run by `npm test` — the same shape as hub-tests. `npm run build` never
  # executes them, so they gate here.
  mirror-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-mirror
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: analytics-mirror/package-lock.json
      - run: npm ci
      - name: Run mirror assertion suites
        run: npm test

  node-builds:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [hub, planner, analytics-mirror]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npm run build

  # The ops scripts' own offline tests (no network, no live system): drift-check's classifier of
  # phase_b results (a string phaseb.ts writes must never read as STALE drift) and deploy-gate's
  # #113 replay. Both need only bash, jq and curl, which the runner image has.
  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/drift-check.test.sh
      - run: bash scripts/deploy-gate.test.sh
