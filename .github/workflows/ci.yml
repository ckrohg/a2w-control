# @purpose CI gate for the auto-deploying services: bridge control-path tests (pytest) +
# build/typecheck for hub, planner, and mirror. Runs on pushes/PRs that touch code
# (knowledge/docs commits are ignored) and on release-* tags (the Pi deploy gate).
# Public repo → free standard runners; swap runs-on for Blacksmith later if CI ever grows.
name: CI

on:
  push:
    branches: [main]
    tags: ["release-*"]
    paths-ignore: ["knowledge/**", ".tenet/**", "**.md"]
  pull_request:
    paths-ignore: ["knowledge/**", ".tenet/**", "**.md"]

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: heatpump-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q

  # The planner's assertions are plain node:assert scripts run under tsx, not a vitest suite --
  # so `npm run build` (the node-builds job) never executed them and they gated nothing. They
  # cover the demand floor, the winter DP, hygiene, realized savings and the forecast path:
  # the logic that decides what water temperature this house runs at. Verified all 7 green
  # before wiring them in, so a red here is a real regression, not a pre-existing failure.
  planner-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run planner assertion suites
        run: |
          set -euo pipefail
          fail=0
          for f in src/*.test.ts; do
            echo "── $f"
            npx tsx "$f" || { echo "::error file=planner/$f::assertions failed"; fail=1; }
          done
          exit "$fail"

  node-builds:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [hub, planner, analytics-mirror]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npm run build
