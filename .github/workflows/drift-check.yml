# @purpose Daily DECLARED-vs-LIVE drift check. Every finding of the 2026-09-16 audit was the
# same bug: state asserted in one place, silently diverging from the truth, with nothing
# watching. The one that mattered -- FINDING-1, the revert-to-baseline failsafe armed nowhere
# while planner /health reported "lease 90m" -- hid behind two months of green dashboards.
# A red run here is the alarm that did not exist.
#
# Read-only: GETs health endpoints and the hub state. Never writes a setpoint, never cuts a
# release-* tag, never touches the Pi.
#
# Optional secret HUB_CLIENT_TOKEN enables the FINDING-1 lease assertion (section [2]).
# Without it that section SKIPS rather than fails -- so the workflow is useful immediately,
# but the assertion that matters most stays dark until the secret is added. Add it with:
#   cd planner && gh secret set HUB_CLIENT_TOKEN --body "$(railway variables --json | jq -r .HUB_CLIENT_TOKEN)"
name: drift-check

on:
  schedule:
    - cron: "23 13 * * *" # daily 13:23 UTC (~09:23 ET) -- off the top of the hour
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/drift-check.sh", ".github/workflows/drift-check.yml"]

concurrency:
  group: drift-check
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run drift check
        env:
          HUB_CLIENT_TOKEN: ${{ secrets.HUB_CLIENT_TOKEN }}
        # tee so the email step can quote the output; exit with the SCRIPT's code, not tee's
        run: |
          bash scripts/drift-check.sh 2>&1 | tee drift.out
          exit "${PIPESTATUS[0]}"
      - name: Email on NEW drift (owner is email-only)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_TO: ${{ secrets.RESEND_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Inert until RESEND_API_KEY + RESEND_TO exist as repo secrets. Secrets cannot be tested in
        # `if:`, so presence is checked here. Subject uses the alerting tier convention (⚠️ = high).
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$RESEND_TO" ]; then
            echo "email skipped: RESEND_API_KEY / RESEND_TO secrets not set (add them to activate)"; exit 0; fi
          body="$(sed -e 's/\x1b\[[0-9;]*m//g' drift.out | head -80)"
          jq -n --arg to "$RESEND_TO" --arg url "$RUN_URL" --arg body "$body" \
            '{from:"onboarding@resend.dev", to:[$to], subject:"⚠️ A2W — NEW drift detected (daily drift-check)", text:("New drift — i.e. something that is NOT on the acknowledged list — was detected.\n\n" + $url + "\n\n" + $body)}' \
          | curl -sf -X POST https://api.resend.com/emails -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" -d @- >/dev/null \
          && echo "email sent to $RESEND_TO" || echo "email FAILED (check key/recipient)"
